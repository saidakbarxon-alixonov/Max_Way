<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex">
    <title>Login</title>

    <link href="{% static 'dashboard/css/font-face.css' %}" rel="stylesheet">
    <link href="{% static 'dashboard/vendor/bootstrap-4.1/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'dashboard/css/theme.css' %}" rel="stylesheet">
</head>

<body>
    <div class="page-wrapper">
        <div class="page-content--bge5">
            <div class="container">
                <div class="login-wrap">
                    <div class="login-content">
                        <div class="login-logo">
                            <a href="#">
                                <img src="{% static 'dashboard/images/logo.svg' %}" alt="MaxWay" width="52" height="55">
                            </a>
                        </div>
                        <div class="login-form">
                            <form method="post">
                                {% csrf_token %}
                                <input type="hidden" name="next" value="{{ next }}">

                                {% if form.non_field_errors %}
                                <div class="alert alert-danger" role="alert">{{ form.non_field_errors.0 }}</div>
                                {% endif %}

                                <div class="form-group">
                                    <label for="id_username">Username</label>
                                    <input class="au-input au-input--full" type="text" id="id_username" name="username"
                                           value="{{ form.username.value|default_if_none:'' }}" placeholder="Username"
                                           autocomplete="username" autofocus required>
                                </div>
                                <div class="form-group">
                                    <label for="id_password">Password</label>
                                    <input class="au-input au-input--full" type="password" id="id_password" name="password"
                                           placeholder="Password" autocomplete="current-password" required>
                                </div>

                                <button class="au-btn au-btn--block au-btn--green m-b-20" type="submit">Sign in</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
