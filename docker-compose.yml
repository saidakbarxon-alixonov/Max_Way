services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    command: >
      bash -c "python3 manage.py migrate &&
               python3 manage.py collectstatic --no-input &&
               gunicorn -b 0.0.0.0:8000 config.wsgi --workers 2 --timeout 300"
    volumes:
      - ./media:/code/media
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: